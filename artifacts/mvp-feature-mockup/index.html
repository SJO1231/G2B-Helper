$('search').addEventListener('input',()=>{state.search=$('search').value;render();});$('resetFilters').onclick=()=>{state.columnFilters={};render();notify('열 필터를 해제했습니다. 검색어는 유지합니다.');};
$('applyColumn').onclick=()=>{if($('columnTerm').value)state.columnFilters[activeColumn]=$('columnTerm').value;else delete state.columnFilters[activeColumn];hidePopovers();render();};
for(const [id,key] of [['hideScreen','hideScreen'],['hideDb','hideDb']])$(id).onchange=()=>{state[key]=$(id).checked;render();notify('중복 숨김 설정을 변경했습니다. 변경 자료는 계속 표시합니다.');};
$('showRaw').onchange=()=>{state.raw=$('showRaw').checked;render();};
$('openSettings').onclick=()=>openSettings();$('saveSettings').onclick=applySettings;
$('settingsContent').addEventListener('input',e=>{const t=e.target;if(t.dataset.config)draft.config[settingsStage][t.dataset.config]=t.value;if(t.hasAttribute('data-code'))draft.config[settingsStage].code[Number(t.dataset.code)]=t.value;if(t.dataset.original)draft.original[t.dataset.original]=t.type==='checkbox'?t.checked:t.value;if(t.dataset.dictKind)draft.original[t.dataset.dictKind][Number(t.dataset.dictIndex)][t.dataset.dictField]=t.type==='checkbox'?t.checked:t.value;if(t.hasAttribute('data-rule'))draft.original.rules[Number(t.dataset.rule)][t.dataset.ruleKey]=t.value;});
$('settingsContent').addEventListener('change',e=>{const t=e.target;if(t.id==='settingStage'){settingsStage=t.value;renderSettings();}if(t.id==='registered')draft.config[settingsStage].registered=t.checked;if(t.id==='draftHideScreen')draft.hideScreen=t.checked;if(t.id==='draftHideDb')draft.hideDb=t.checked;if(t.dataset.key){draft.config[settingsStage].keys=[...$('settingsContent').querySelectorAll('[data-key]:checked')].map(el=>el.dataset.key);$('keyPreview').textContent=draft.config[settingsStage].keys.join(' + ')||'업무키를 선택하세요.';}if(t.id==='relationSelect'){relationIndex=Number(t.value);renderSettings();}if(t.id==='relationKind')draft.relations[relationIndex].kind=t.value;});
$('settingsContent').addEventListener('change',e=>{const t=e.target;if(t.id==='defaultRules'){draft.original.useDefaults=t.checked;renderSettings();}if(t.dataset.document)draft.original.documents[t.dataset.document]=t.value;});
$('settingsContent').addEventListener('keydown',e=>{const t=e.target;if(!t.dataset.shortcut||e.key==='Tab'||e.key==='Escape')return;e.preventDefault();if(e.key==='Backspace'||e.key==='Delete')t.value='';else if(!['Alt','Shift','Control','Meta'].includes(e.key))t.value=[e.ctrlKey?'Ctrl':'',e.altKey?'Alt':'',e.shiftKey?'Shift':'',e.metaKey?'Meta':'',e.key.toUpperCase()].filter(Boolean).join('+');draft.original.shortcuts[t.dataset.shortcut]=t.value;});
$('toggleSidebar').onclick=()=>toggleSidebar();$('closeSidebar').onclick=()=>toggleSidebar(false);$('drawerShade').onclick=()=>toggleSidebar(false);$('manageAll').onclick=()=>openManager();$('quickNote').onclick=()=>openEditor('note',null,true);$('quickSchedule').onclick=()=>openEditor('schedule',null,true);
$('managerScope').onchange=renderManager;$('managerSearch').oninput=renderManager;$('managerAdd').onclick=()=>openEditor(managerKind);
$('editScope').onchange=()=>fillTargets($('editScope').value==='business'?state.selected:state.stage);
$('editForm').onsubmit=e=>{e.preventDefault();if(!$('editName').value.trim()){$('editStatus').textContent='제목을 입력하세요.';return;}const n={...editing,title:$('editName').value.trim(),content:$('editContent').value,scope:$('editScope').value,target:$('editTarget').value};if(n.kind==='schedule')n.date=$('editDate').value;else delete n.date;if(n.id)notes=notes.map(old=>old.id===n.id?n:old);else{n.id='n'+nextNote++;notes.push(n);}$('editor').close();renderSidebar();renderManager();notify((n.kind==='note'?'메모':'일정')+'를 시안에 반영했습니다. 새로고침하면 초기화됩니다.');};
$('settings').addEventListener('cancel',()=>{draft=null;});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hidePopovers();});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.popover')&&!e.target.closest('#properties'))hidePopovers();});
window.addEventListener('resize',hidePopovers);
for(const [id,delta] of [['previousYear',-1],['nextYear',1]])$(id).onclick=()=>{for(const field of ['startDate','endDate']){const v=$(field).value;if(/^\d{4}\.\d{2}\.\d{2}$/.test(v))$(field).value=String(Number(v.slice(0,4))+delta)+v.slice(4);}render();notify('샘플 기간을 변경했습니다.');};
for(const id of ['startDate','endDate','dateKey'])$(id).onchange=()=>{render();notify('샘플 날짜 필터를 변경했습니다.');};
$('completionFilter').onchange=render;
$('hiddenUser').onclick=()=>{state.hiddenUser=!state.hiddenUser;render();};
$('grid').addEventListener('change',e=>{const id=e.target.dataset.finish;if(id){samples[state.stage].find(r=>r.id===id).userValues['종결']=e.target.checked;state.dirty=true;render();notify('샘플 행의 종결 표시를 변경했습니다.');}});
$('finishSelected').onclick=()=>{const row=currentRow();if(!row){notify('종결 표시를 바꿀 샘플 행을 선택하세요.');return;}row.userValues['종결']=!row.userValues['종결'];state.dirty=true;render();notify('샘플 행의 종결 표시만 변경했습니다.');};
$('saveRows').onclick=()=>{state.dirty=false;render();notify('시안 내부 목록에만 반영했습니다. 실제 DB 저장은 수행하지 않습니다.');};
function changeStage(id){state.stage=id;state.table='main';state.selected=null;state.columnFilters={};state.search='';$('search').value='';$('completionFilter').value='all';notify('시안 · '+config[id].screenName+' · 샘플 자료');render();}
$('sampleStage').onchange=()=>changeStage($('sampleStage').value);
$('variant').onchange=()=>{state.variant=$('variant').value;if(state.variant==='original'&&state.stage==='inspection')state.stage='contract';toggleSidebar(false);changeMode(state.mode);};
function showInfo(kind){const titles={raw:'원본 JSON',json:'JSON',csv:'CSV',excel:'Excel',generate:'생성 대상 미리보기',trash:'휴지통',shareExport:'설정 내보내기',shareRestore:'되돌리기 미리보기'};$('informationTitle').textContent=titles[kind]||kind;let content='';const business=visibleRows(),rows=state.mode==='extract'?extractionRows(extractionEntries().find(e=>e.id===state.table)||{fields:[],empty:true},business):business;if(kind==='generate')content='<p>시안 · 선택 자료 '+(currentRow()?1:0)+'건</p><p>'+escapeHtml(labelOf(currentRow()))+'</p><p>연결 서식: '+escapeHtml(originalSettings.documents[state.stage]||'미지정')+'</p><p class="hint">표시명과 분리된 원천 키를 사용합니다. 실제 HWPX 생성은 구현하지 않습니다.</p>';else if(kind==='trash')content='<p>샘플 휴지통이 비어 있습니다.</p>';else if(kind==='shareRestore')content='<p>공유 설정 적용 전후 비교 화면의 예시입니다. 실제 파일 복원은 구현하지 않습니다.</p>';else{const value=kind==='shareExport'?draft.original:kind==='raw'?{pointInfo:extractionRows({point:true,fields:extractionSchema()?.pointKeys||[]},businessRows())[0].fields,tables:Object.fromEntries(Object.entries(extractionSchema()?.tables||{}).map(([id,fields])=>[id,extractionRows({id,fields,empty:fields.length===0},samples[state.stage].filter(r=>r.inCapture)).map(r=>r.fields)]))}:rows.map(r=>({...r.fields,...(r.items?{items:r.items}:{})}));content='<p class="hint">시안 · 샘플 미리보기입니다. 파일을 내보내거나 저장하지 않습니다.</p><pre class="raw-json">'+escapeHtml(kind==='csv'?Object.keys(rows[0]?.fields||{}).join(',')+'\n'+rows.map(r=>Object.values(r.fields).map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'):JSON.stringify(value,null,2))+'</pre>';}$('informationBody').innerHTML=content;$('information').showModal();}
for(const [id,kind] of [['rawJson','raw'],['jsonPreview','json'],['csvPreview','csv'],['excelPreview','excel'],['generatePreview','generate']])$(id).onclick=()=>showInfo(kind);
$('reset').onclick=()=>location.reload();
$('closeShell').onclick=()=>{$('shell').hidden=true;$('closedView').hidden=false;hidePopovers();};$('restoreShell').onclick=()=>{$('closedView').hidden=true;$('shell').hidden=false;};
$('propertyPopover').addEventListener('change',e=>{const t=e.target;if(!t.hasAttribute('data-column-visible'))return;const key=propertyKey(),fields=new Set(hiddenColumns[key]||[]);if(t.checked)fields.delete(t.dataset.columnVisible);else fields.add(t.dataset.columnVisible);hiddenColumns[key]=[...fields];render();});
$('showAllColumns').onclick=()=>{hiddenColumns[propertyKey()]=[];render();renderProperties();};
if(location.hash==='#proposal')state.variant='proposal';
render();
</script>
</body>
